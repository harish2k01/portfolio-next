name: Publish released portfolio
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      sha:
        required: true
        type: string
      blog_artifact:
        required: true
        type: string
    secrets:
      GH_APP_ID:
        required: true
      GH_APP_PRIVATE_KEY:
        required: true
permissions:
  contents: write
  packages: write
jobs:
  publish:
    runs-on: portfolio-next-runner
    outputs:
      digest: ${{ steps.metadata.outputs.digest }}
      latest: ${{ steps.metadata.outputs.latest }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ inputs.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable release identity
        shell: bash
        run: |
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Download the strictly validated article snapshot
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.blog_artifact }}
          path: src/data
      - name: Compare against published content
        id: plan
        run: node scripts/release/registry.mjs
      - name: Nothing changed
        if: steps.plan.outputs.action == 'skip'
        run: echo 'The published image already contains these articles. No build, push, tag, release, or digest change.' >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-qemu-action@v3
        if: steps.plan.outputs.action == 'build'
      - uses: docker/setup-buildx-action@v3
        if: steps.plan.outputs.action != 'skip'
      - uses: docker/login-action@v3
        if: steps.plan.outputs.action != 'skip'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and validate production container
        if: steps.plan.outputs.action == 'build'
        run: |
          docker build -t portfolio:test .
          docker run -d --name portfolio-test -p 8080:8080 --user 101:101 --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges portfolio:test
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:8080/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/ | grep -q 'Latest articles'
          test "$(curl -s -o /tmp/404.html -w '%{http_code}' http://localhost:8080/not-a-page/)" = '404'
      - name: Push immutable content image
        if: steps.plan.outputs.action == 'build'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.plan.outputs.image }}:${{ steps.plan.outputs.immutable }}
          labels: |
            org.opencontainers.image.title=Harish portfolio
            org.opencontainers.image.description=Static SRE and DevOps portfolio with a build-time article snapshot
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag }}
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.revision=${{ inputs.sha }}
            org.opencontainers.image.created=${{ steps.plan.outputs.created }}
            io.harish.portfolio.blog-sha256=${{ steps.plan.outputs.hash }}
          cache-from: type=gha,scope=portfolio
          cache-to: type=gha,mode=max,scope=portfolio
          provenance: true
          sbom: true
      - name: Verify image and prepare release metadata
        id: metadata
        run: node scripts/release/metadata.mjs
      - name: Promote version and SHA-content aliases
        if: steps.plan.outputs.action != 'skip'
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          DIGEST: ${{ steps.metadata.outputs.digest }}
          SHA_TAG: ${{ steps.plan.outputs.shaTag }}
          IS_LATEST: ${{ steps.metadata.outputs.latest }}
        run: |
          args=(--prefer-index=false --tag "$IMAGE:$RELEASE_TAG" --tag "$IMAGE:$SHA_TAG")
          if [ "$IS_LATEST" = 'true' ]; then args+=(--tag "$IMAGE:latest"); fi
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
      - name: Record exact image and articles on the release
        if: steps.plan.outputs.action != 'skip'
        run: |
          gh release upload "$RELEASE_TAG" image.json src/data/blog.json --clobber
          echo 'Published image and article snapshot are attached to the GitHub release.' >> "$GITHUB_STEP_SUMMARY"
          cat image.json >> "$GITHUB_STEP_SUMMARY"
      - name: Stop test container
        if: always()
        run: docker rm -f portfolio-test || true
  update-homelab:
    needs: publish
    if: needs.publish.outputs.latest == 'true'
    uses: harish2k01/homelab-ops/.github/workflows/update-version.yaml@main
    with:
      app_name: portfolio-next
      image_tag: ${{ inputs.tag }}
      image_digest: ${{ needs.publish.outputs.digest }}
      runner: portfolio-next-runner
    secrets:
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
