name: Publish released portfolio
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      sha:
        required: true
        type: string
      blog_artifact:
        required: true
        type: string
    secrets:
      GH_APP_ID:
        required: true
      GH_APP_PRIVATE_KEY:
        required: true
permissions:
  contents: write
  packages: write
defaults:
  run:
    shell: bash
jobs:
  publish:
    runs-on: portfolio-next-runner
    container: node:24-bookworm
    outputs:
      digest: ${{ steps.metadata.outputs.digest }}
      latest: ${{ steps.metadata.outputs.latest }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ inputs.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install workflow tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git gh jq unzip python3 build-essential
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable" > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y --no-install-recommends docker-ce-cli docker-buildx-plugin
          docker version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable release identity
        shell: bash
        run: |
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Download the strictly validated article snapshot
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.blog_artifact }}
          path: src/data
      - name: Compare against published content
        id: plan
        run: node scripts/release/registry.mjs
      - name: Nothing changed
        if: steps.plan.outputs.action == 'skip'
        run: echo 'The published image already contains these articles. No build, push, tag, release, or digest change.' >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare native build recipe for current and historical releases
        if: steps.plan.outputs.action == 'build'
        shell: bash
        run: |
          # v0.1.0/v0.2.0 predate the native build-stage pin. Adapt only that FROM
          # in a temporary copy; release tags and checked-out source remain intact.
          sed 's/^FROM node:24-alpine AS build$/FROM --platform=$BUILDPLATFORM node:24-alpine AS build/' Dockerfile > "$RUNNER_TEMP/portfolio-native.Dockerfile"
          grep -Fxq 'FROM --platform=$BUILDPLATFORM node:24-alpine AS build' "$RUNNER_TEMP/portfolio-native.Dockerfile"
      - uses: docker/setup-buildx-action@v3
        if: steps.plan.outputs.action != 'skip'
      - uses: docker/login-action@v3
        if: steps.plan.outputs.action != 'skip'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and validate production container
        if: steps.plan.outputs.action == 'build'
        run: |
          docker build --file "$RUNNER_TEMP/portfolio-native.Dockerfile" -t portfolio:test .
          docker run -d --name portfolio-test --network "container:$HOSTNAME" --user 101:101 --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges portfolio:test
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:8080/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/ | grep -q 'Latest articles'
          test "$(curl -s -o /tmp/404.html -w '%{http_code}' http://localhost:8080/not-a-page/)" = '404'
      - name: Push immutable content image
        if: steps.plan.outputs.action == 'build'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ runner.temp }}/portfolio-native.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.plan.outputs.image }}:${{ steps.plan.outputs.immutable }}
          labels: |
            org.opencontainers.image.title=Harish portfolio
            org.opencontainers.image.description=Static SRE and DevOps portfolio with a build-time article snapshot
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag }}
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.revision=${{ inputs.sha }}
            org.opencontainers.image.created=${{ steps.plan.outputs.created }}
            io.harish.portfolio.blog-sha256=${{ steps.plan.outputs.hash }}
            io.harish.portfolio.packaging-revision=${{ github.workflow_sha }}
          cache-from: type=gha,scope=portfolio
          cache-to: type=gha,mode=max,scope=portfolio
          provenance: true
          sbom: true
      - name: Verify image and prepare release metadata
        id: metadata
        run: node scripts/release/metadata.mjs
      - name: Promote version and SHA-content aliases
        if: steps.plan.outputs.action != 'skip'
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          DIGEST: ${{ steps.metadata.outputs.digest }}
          SHA_TAG: ${{ steps.plan.outputs.shaTag }}
          IS_LATEST: ${{ steps.metadata.outputs.latest }}
        run: |
          args=(--prefer-index=false --tag "$IMAGE:$RELEASE_TAG" --tag "$IMAGE:$SHA_TAG")
          if [ "$IS_LATEST" = 'true' ]; then args+=(--tag "$IMAGE:latest"); fi
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
      - name: Record exact image and articles on the release
        if: steps.plan.outputs.action != 'skip'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner,
              repo,
              tag: process.env.RELEASE_TAG,
            });

            for (const file of ["image.json", "src/data/blog.json"]) {
              const name = path.basename(file);
              for (const asset of release.assets.filter((item) => item.name === name)) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: asset.id,
                });
              }

              const data = fs.readFileSync(file);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name,
                data,
                headers: {
                  "content-type": "application/octet-stream",
                  "content-length": fs.statSync(file).size,
                },
              });
            }

            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              `Published image and article snapshot are attached to the GitHub release.\n${fs.readFileSync("image.json", "utf8")}`,
            );
      - name: Stop test container
        if: always()
        run: docker rm -f portfolio-test || true
  update-homelab:
    needs: publish
    if: needs.publish.outputs.latest == 'true'
    uses: harish2k01/homelab-ops/.github/workflows/update-version.yaml@main
    with:
      app_name: portfolio-next
      image_tag: ${{ inputs.tag }}
      image_digest: ${{ needs.publish.outputs.digest }}
      runner: portfolio-next-runner
    secrets:
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
