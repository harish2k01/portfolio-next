name: Validate portfolio
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-label:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: portfolio-next-runner
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(label => label.name);
            const selected = labels.filter(label => ['major', 'minor', 'patch'].includes(label));
            if (selected.length !== 1) core.setFailed('Add exactly one release label: major, minor, or patch.');
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: portfolio-next-runner
    env:
      BLOG_MODE: snapshot
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Dry-run release reconciliation (read-only)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: node scripts/release/plan.mjs --dry-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-static
          path: dist/
      - name: Build container
        run: docker build -t portfolio:test .
      - name: Verify production routing
        run: |
          docker run -d --name portfolio-test -p 8080:8080 --user 101:101 --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges portfolio:test
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:8080/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/ > /tmp/home.html
          grep -q 'Harish' /tmp/home.html
          curl -fsS http://localhost:8080/projects/homelab-ops/ > /dev/null
          test "$(curl -s -o /tmp/missing.html -w '%{http_code}' http://localhost:8080/not-a-real-page/)" = "404"
          grep -q 'wrong turn' /tmp/missing.html
      - name: Stop test container
        if: always()
        run: docker rm -f portfolio-test || true
