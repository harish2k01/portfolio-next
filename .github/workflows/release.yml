name: Release and refresh
on:
  push:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: "17 1 * * *" # 06:47 IST; GitHub schedules can be delayed.
  workflow_dispatch:
permissions:
  contents: read
# All producers share one lock. The planner reconciles every unreleased merge,
# including when GitHub replaces a pending run with a newer one.
concurrency:
  group: portfolio-release-and-refresh
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: portfolio-next-runner
    permissions:
      contents: write
      pull-requests: read
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Inspect unreleased merges without mutations
        id: inspect
        run: node scripts/release/plan.mjs --dry-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate before creating releases
        if: steps.inspect.outputs.new_count != '0'
        run: npm run validate
        env:
          BLOG_MODE: snapshot
      - name: Reconcile labeled merges and create releases
        id: plan
        run: node scripts/release/plan.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: release-plan.json
  articles:
    needs: release
    if: needs.release.outputs.targets != '[]'
    # Trusted main only. Fetch public RSS directly from Ghost, without edge filtering.
    runs-on: portfolio-next-runner
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - name: Fetch and validate RSS from Ghost inside the cluster
        run: npm run blog:refresh
        env:
          PORTFOLIO_RSS_URL: http://ghost.ghost.svc.cluster.local:2368/rss/
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-blog-${{ github.run_id }}-${{ github.run_attempt }}
          path: src/data/blog.json
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: [release, articles]
    if: needs.release.outputs.targets != '[]'
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(needs.release.outputs.targets) }}
    uses: ./.github/workflows/container.yml
    with:
      tag: ${{ matrix.target.tag }}
      sha: ${{ matrix.target.sha }}
      blog_artifact: portfolio-blog-${{ github.run_id }}-${{ github.run_attempt }}
    secrets:
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
